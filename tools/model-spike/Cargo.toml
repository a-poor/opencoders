[package]
name = "opencoders-model-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
prettyplease = "=0.2.37"
regress = "=0.12.0"
schemars = "=0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
typify = { version = "=0.8.0", default-features = false }

[[bin]]
name = "model-spike"
path = "src/main.rs"

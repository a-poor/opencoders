name: Pinned server compatibility

# Explicit opt-in: ordinary pull requests never download or launch OpenCode.
on:
  workflow_dispatch:
    inputs:
      active_execution:
        description: Also run active execution against a scripted localhost provider
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - name: Compile before starting the disposable server
        run: cargo +stable test --locked --test live --no-run
      - name: Download, verify, test, and stop the pinned server
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 tools/live/run.py

  active:
    if: inputs.active_execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - name: Compile before starting the disposable servers
        run: cargo +stable test --locked --test live_active --no-run
      - name: Exercise active execution with a scripted localhost provider
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 tools/live/active.py

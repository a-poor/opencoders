name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable doc --workspace --all-features --no-deps --locked
      - run: cargo +stable check --examples --all-features --locked
      - name: Check live-test runner without starting a server
        run: python3 -m unittest discover -s tools/live -p 'test_*.py'
      - name: Check reviewed API coverage
        run: |
          python3 -m unittest discover -s tools/coverage -p 'test_*.py'
          python3 tools/coverage/report.py --check
      - name: Test upstream schema checker offline
        run: python3 -m unittest discover -s tools/schema -p 'test_*.py'

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [default, http-only, websocket, http-websocket]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - if: matrix.features == 'default'
        run: cargo +stable test --workspace --locked
      - if: matrix.features == 'http-only'
        run: cargo +stable test --locked --no-default-features
      - if: matrix.features == 'websocket'
        run: cargo +stable test --locked --features websocket
      - if: matrix.features == 'http-websocket'
        run: cargo +stable test --locked --no-default-features --features websocket

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --lib --locked
      - run: cargo +1.88.0 check --lib --no-default-features --locked
      - run: cargo +1.88.0 check --lib --all-features --locked
      - run: cargo +1.88.0 check --lib --no-default-features --features websocket --locked

  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Generated text depends on rustfmt; pin the toolchain used to check it.
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: cargo +1.99.1 fetch --locked
      - name: Check every checked-in generation target
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          cargo run --locked --offline -p opencoders-model-spike -- --check
          cargo run --locked --offline -p opencoders-model-spike -- --server-info --check
          cargo run --locked --offline -p opencoders-model-spike -- --discovery --check
          cargo run --locked --offline -p opencoders-model-spike -- --sessions --check
          cargo run --locked --offline -p opencoders-model-spike -- --messages --check
          cargo run --locked --offline -p opencoders-model-spike -- --inbox --check
          cargo run --locked --offline -p opencoders-model-spike -- --events --check
          cargo run --locked --offline -p opencoders-model-spike -- --permissions --check
          cargo run --locked --offline -p opencoders-model-spike -- --forms --check
          cargo run --locked --offline -p opencoders-model-spike -- --workspace --check
          cargo run --locked --offline -p opencoders-model-spike -- --ptys --check
          cargo run --locked --offline -p opencoders-model-spike -- --workflows --check
          cargo run --locked --offline -p opencoders-model-spike -- --setup --check
          cargo run --locked --offline -p opencoders-model-spike -- --shells --check

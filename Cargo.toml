[package]
name = "opencoders"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async Rust client for the OpenCode v2 HTTP API"
repository = "https://github.com/a-poor/opencoders"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["opencode", "async", "client", "api"]
categories = ["api-bindings", "asynchronous"]
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/tests/**/*.rs",
    "/tests/fixtures/*.json",
    "/README.md",
    "/docs/**/*.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT.txt",
    "/LICENSE-APACHE.txt",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
websocket = ["dep:tokio-tungstenite", "futures-util/sink"]

[[example]]
name = "pty"
required-features = ["websocket"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
regress = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
wiremock = "0.6.5"

[workspace]
members = ["tools/model-spike"]
default-members = ["."]
resolver = "3"

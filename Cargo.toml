[package]
name = "opencoders"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
wiremock = "0.6.5"

[workspace]
members = ["tools/model-spike"]
default-members = ["."]
resolver = "3"
